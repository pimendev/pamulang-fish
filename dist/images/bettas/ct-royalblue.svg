<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </radialGradient>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="50%" stop-color="#1e40af" />
            <stop offset="100%" stop-color="#60a5fa" />
        </linearGradient>
        <linearGradient id="dorsalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1e40af" />
            <stop offset="100%" stop-color="#60a5fa" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Deep Water Background -->
    <rect width="600" height="450" fill="url(#bgGrad)" />

    <!-- Ambient Light Circles -->
    <circle cx="300" cy="230" r="180" fill="#1d4ed8" opacity="0.12" />
    <circle cx="360" cy="200" r="110" fill="#60a5fa" opacity="0.15" />

    <!-- Water Bubble Effects -->
    <circle cx="80" cy="120" r="12" fill="#38bdf8" opacity="0.18" />
    <circle cx="520" cy="90" r="16" fill="#06b6d4" opacity="0.2" />
    <circle cx="480" cy="380" r="9" fill="#38bdf8" opacity="0.15" />
    <circle cx="110" cy="360" r="14" fill="#67e8f9" opacity="0.12" />

    <!-- Betta Silhouette Group with Glow -->
    <g filter="url(#glow)">
        <!-- Dorsal Fin (Atas) -->
        <path d="M 180,210 C 190,130 260,110 320,135 C 290,175 250,205 180,210 Z" fill="url(#dorsalGrad)" opacity="0.9" />
        
        <!-- Anal Fin (Bawah) -->
        <path d="M 170,270 C 190,360 270,370 330,330 C 290,295 240,275 170,270 Z" fill="url(#dorsalGrad)" opacity="0.9" />

        <!-- Caudal Fin (Ekor) -->
        <path d="M 310,240 L 520,150 L 460,200 L 550,210 L 470,235 L 560,250 L 470,265 L 550,290 L 460,300 L 520,350 L 310,260 Z" fill="#1d4ed8" opacity="0.85" />
                        <line x1="310" y1="240" x2="550" y2="160" stroke="#60a5fa" stroke-width="4" />
                        <line x1="310" y1="250" x2="570" y2="250" stroke="#60a5fa" stroke-width="4" />
                        <line x1="310" y1="260" x2="550" y2="340" stroke="#60a5fa" stroke-width="4" />

        <!-- Body -->
        <ellipse cx="210" cy="245" rx="100" ry="52" fill="url(#bodyGrad)" />

        <!-- Eye -->
        <circle cx="140" cy="235" r="7" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5" />
        <circle cx="138" cy="233" r="2.5" fill="#ffffff" />

        <!-- Scales Pattern Highlights -->
        <path d="M 180,230 Q 195,245 180,260" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.75" />
        <path d="M 210,225 Q 225,245 210,265" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.75" />
        <path d="M 240,230 Q 255,245 240,260" stroke="#60a5fa" stroke-width="3" fill="none" opacity="0.75" />

        <!-- Pectoral Fin (Sirip Dada) -->
        <path d="M 175,250 Q 215,280 200,295 Q 170,280 175,250 Z" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Top Left Badge -->
    <rect x="25" y="25" width="130" height="28" rx="14" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="40" cy="39" r="4" fill="#60a5fa" />
    <text x="52" y="43" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">PERFECT RAYS</text>

    <!-- Bottom Info Panel -->
    <rect x="25" y="380" width="550" height="48" rx="12" fill="#0f172a" opacity="0.88" stroke="#334155" stroke-width="1" />
    <text x="45" y="405" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800">Crowntail Royal Blue Mask</text>
    <text x="45" y="420" fill="#60a5fa" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600">Ocean Blue Body with Dark Head</text>
    <text x="555" y="410" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" text-anchor="end">PAMULANG FISH</text>
</svg>